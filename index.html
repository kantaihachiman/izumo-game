<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>艦隊八幡社 はちまん売店</title>
<style>
  * {
    box-sizing: border-box;
  }

  :root {
    --ink: #4a2c1a;
    --brown: #7b3f20;
    --red: #bd3a2b;
    --cream: #fff7df;
    --gold: #e9bd57;
    --navy: #263b53;
  }

  body {
    margin: 0;
    min-height: 100vh;
    font-family: "Yu Gothic", "Meiryo", sans-serif;
    color: var(--ink);
    background:
      linear-gradient(rgba(255, 247, 219, 0.82), rgba(255, 239, 199, 0.9)),
      repeating-linear-gradient(0deg, #f3dba6 0 18px, #eccb86 18px 21px);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 14px;
  }

  button {
    font-family: inherit;
  }

  .game {
    width: min(940px, 100%);
    background: var(--cream);
    border: 4px solid var(--brown);
    box-shadow: 0 10px 0 #b66b35, 0 18px 28px rgba(72, 35, 14, 0.25);
  }

  header {
    padding: 12px 16px 14px;
    text-align: center;
    background: var(--red);
    color: #fff8df;
    border-bottom: 4px solid var(--brown);
  }

  h1 {
    margin: 0;
    font-size: clamp(24px, 4.5vw, 42px);
    letter-spacing: 0.08em;
    text-shadow: 2px 2px 0 #71281d;
  }

  .sub {
    margin-top: 4px;
    font-size: 14px;
    font-weight: 700;
  }

  .status {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 8px;
    padding: 10px;
    background: #f0d58b;
    border-bottom: 3px solid var(--brown);
  }

  .status-card {
    min-width: 0;
    padding: 8px 6px;
    text-align: center;
    background: #fff9e8;
    border: 2px solid #8e552d;
    font-weight: 800;
  }

  .label {
    display: block;
    font-size: 12px;
    color: #765035;
  }

  .value {
    display: block;
    margin-top: 2px;
    font-size: clamp(18px, 3.5vw, 26px);
  }

  .stage {
    position: relative;
    height: 390px;
    overflow: hidden;
    background: linear-gradient(#91c7d7 0 38%, #f7e4b1 38% 100%);
    border-bottom: 4px solid var(--brown);
  }

  .sun {
    position: absolute;
    right: 70px;
    top: 32px;
    width: 72px;
    height: 72px;
    background: #f8d36b;
    border: 4px solid #9e4a25;
    border-radius: 50%;
  }

  .cloud {
    position: absolute;
    left: 42px;
    top: 44px;
    width: 96px;
    height: 32px;
    background: #fff7e2;
    border: 3px solid #8d5a33;
    border-radius: 999px;
  }

  .cloud::before,
  .cloud::after {
    content: "";
    position: absolute;
    background: #fff7e2;
    border: 3px solid #8d5a33;
    border-radius: 50%;
  }

  .cloud::before {
    left: 18px;
    top: -22px;
    width: 36px;
    height: 36px;
  }

  .cloud::after {
    right: 14px;
    top: -16px;
    width: 32px;
    height: 32px;
  }

  .sea {
    position: absolute;
    left: 0;
    right: 0;
    top: 142px;
    height: 58px;
    background:
      repeating-linear-gradient(135deg, #447f9d 0 16px, #6ea8bd 16px 32px);
    border-top: 3px solid #31576b;
    border-bottom: 3px solid #31576b;
    animation: wave 1.4s linear infinite;
  }

  @keyframes wave {
    from { background-position: 0 0; }
    to { background-position: 32px 0; }
  }

  .ship {
    position: absolute;
    left: 55px;
    top: 111px;
    width: 135px;
    height: 42px;
    background: #596878;
    border: 3px solid #2d3640;
    clip-path: polygon(0 30%, 90% 30%, 100% 55%, 82% 100%, 12% 100%);
  }

  .ship::before {
    content: "";
    position: absolute;
    left: 44px;
    top: -26px;
    width: 34px;
    height: 30px;
    background: #738291;
    border: 3px solid #2d3640;
  }

  .torii {
    position: absolute;
    left: 50%;
    top: 68px;
    transform: translateX(-50%);
    width: 250px;
    height: 190px;
  }

  .torii .top {
    position: absolute;
    left: 10px;
    top: 0;
    width: 230px;
    height: 26px;
    background: #c53725;
    border: 4px solid #762719;
  }

  .torii .top2 {
    position: absolute;
    left: 35px;
    top: 34px;
    width: 180px;
    height: 22px;
    background: #d44a2c;
    border: 4px solid #762719;
  }

  .torii .post {
    position: absolute;
    top: 50px;
    width: 28px;
    height: 138px;
    background: #c53725;
    border: 4px solid #762719;
  }

  .torii .left { left: 54px; }
  .torii .right { right: 54px; }

  .shrine {
    position: absolute;
    left: 50%;
    bottom: 0;
    transform: translateX(-50%);
    width: 360px;
    height: 160px;
    background: #8f4a2b;
    border: 4px solid #5e2b18;
  }

  .roof {
    position: absolute;
    left: -34px;
    top: -54px;
    width: 428px;
    height: 70px;
    background: var(--navy);
    border: 4px solid #142031;
    clip-path: polygon(0 100%, 12% 35%, 50% 0, 88% 35%, 100% 100%);
  }

  .sign {
    position: absolute;
    left: 50%;
    top: 20px;
    transform: translateX(-50%);
    width: 184px;
    padding: 7px 10px;
    text-align: center;
    background: #fff1c4;
    border: 3px solid #5e2b18;
    font-weight: 900;
  }

  .stall {
    position: absolute;
    left: 35px;
    bottom: 0;
    width: 292px;
    height: 80px;
    background: #f3c15f;
    border-top: 4px solid #5e2b18;
  }

  .goods {
    position: absolute;
    right: 42px;
    bottom: 42px;
    display: flex;
    gap: 10px;
  }

  .good {
    width: 48px;
    height: 44px;
    display: grid;
    place-items: center;
    background: #fff8df;
    border: 3px solid #6e3d24;
    border-radius: 6px;
    font-weight: 900;
  }

  .hachiman {
    position: absolute;
    left: 32%;
    bottom: 8px;
    width: 90px;
    height: auto;
    transform: translateX(-50%);
    z-index: 3;
    filter: drop-shadow(3px 5px 0 rgba(74, 44, 26, 0.18));
    animation: idle 1.1s ease-in-out infinite alternate;
  }

  .hachiman img {
    display: block;
    width: 100%;
    height: auto;
  }

  @keyframes idle {
    from { transform: translateX(-50%) translateY(0); }
    to { transform: translateX(-50%) translateY(-4px); }
  }

  .visitor {
    position: absolute;
    right: 92px;
    bottom: 42px;
    width: 126px;
    height: 132px;
    transition: transform 0.22s ease, opacity 0.22s ease;
  }

  .visitor.enter {
    animation: walkIn 0.35s ease-out;
  }

  @keyframes walkIn {
    from { transform: translateX(80px); opacity: 0; }
    to { transform: translateX(0); opacity: 1; }
  }

  .visitor-face {
    position: absolute;
    left: 32px;
    top: 0;
    width: 62px;
    height: 62px;
    display: grid;
    place-items: center;
    background: #ffe0c2;
    border: 3px solid #5b3525;
    border-radius: 50%;
    font-size: 29px;
  }

  .visitor-body {
    position: absolute;
    left: 24px;
    top: 58px;
    width: 78px;
    height: 68px;
    background: #4b8f76;
    border: 3px solid #31594b;
    border-radius: 16px 16px 8px 8px;
  }

  .visitor-tag {
    position: absolute;
    left: 13px;
    top: 106px;
    width: 100px;
    padding: 2px 4px;
    text-align: center;
    background: #fff1c4;
    border: 2px solid #6e3d24;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 900;
  }

  .customer-line {
    display: block;
    margin-bottom: 3px;
    color: #765035;
    font-size: 13px;
  }

  .bubble {
    position: absolute;
    right: 126px;
    bottom: 160px;
    width: min(300px, 48vw);
    min-height: 84px;
    padding: 12px 14px;
    background: #fff9e8;
    border: 3px solid #6e3d24;
    border-radius: 12px;
    box-shadow: 4px 4px 0 rgba(74, 44, 26, 0.18);
    font-weight: 900;
    line-height: 1.45;
  }

  .bubble::after {
    content: "";
    position: absolute;
    right: -16px;
    bottom: 18px;
    width: 26px;
    height: 26px;
    background: #fff9e8;
    border-right: 3px solid #6e3d24;
    border-bottom: 3px solid #6e3d24;
    transform: rotate(-45deg);
  }

  .patience {
    position: absolute;
    left: 14px;
    right: 14px;
    bottom: 8px;
    height: 8px;
    background: #e6c88a;
    border: 2px solid #6e3d24;
  }

  .patience span {
    display: block;
    height: 100%;
    width: 100%;
    background: #4b8f76;
    transition: width 0.08s linear, background 0.16s ease;
  }

  .patience span.mid {
    background: #d39a43;
  }

.patience {
  position: relative;
  left: auto;
  right: auto;
  bottom: auto;
  width: 100%;
  height: 10px;
  margin-top: 6px;
  background: #e6c88a;
  border: 2px solid #6e3d24;
}
  .message {
    position: absolute;
    left: 50%;
    top: 80px;
    transform: translateX(-50%);
    min-width: 220px;
    padding: 8px 14px;
    text-align: center;
    color: #fff8df;
    background: #4b8f76;
    border: 3px solid #31594b;
    font-weight: 900;
    opacity: 0;
    pointer-events: none;
    z-index: 4;
  }

  .message.show {
    animation: pop 0.7s ease;
  }

  .combo-banner {
    position: absolute;
    left: 50%;
    top: 128px;
    z-index: 5;
    min-width: 210px;
    padding: 10px 16px;
    color: #fff8df;
    background: #bd3a2b;
    border: 4px solid #7a261b;
    text-align: center;
    font-size: clamp(20px, 4vw, 34px);
    font-weight: 900;
    text-shadow: 2px 2px 0 #71281d;
    box-shadow: 5px 5px 0 rgba(74, 44, 26, 0.18);
    opacity: 0;
    pointer-events: none;
    transform: translateX(-50%) scale(0.92);
  }

  .combo-banner.show {
    animation: comboPop 0.82s ease;
  }

  @keyframes pop {
    0% { opacity: 0; transform: translateX(-50%) translateY(8px); }
    18% { opacity: 1; transform: translateX(-50%) translateY(0); }
    80% { opacity: 1; transform: translateX(-50%) translateY(0); }
    100% { opacity: 0; transform: translateX(-50%) translateY(-8px); }
  }

  @keyframes comboPop {
    0% { opacity: 0; transform: translateX(-50%) translateY(12px) scale(0.86); }
    18% { opacity: 1; transform: translateX(-50%) translateY(0) scale(1.06); }
    42% { opacity: 1; transform: translateX(-50%) translateY(0) scale(1); }
    84% { opacity: 1; transform: translateX(-50%) translateY(0) scale(1); }
    100% { opacity: 0; transform: translateX(-50%) translateY(-10px) scale(0.96); }
  }

  .game.good-sale .stage {
    animation: saleFlash 0.34s ease;
  }

  .game.miss-sale .stage {
    animation: missFlash 0.34s ease;
  }

  .game.miss-sale .visitor {
    animation: shake 0.22s ease;
  }

  @keyframes saleFlash {
    0% { box-shadow: inset 0 0 0 0 rgba(233, 189, 87, 0); }
    40% { box-shadow: inset 0 0 0 8px rgba(233, 189, 87, 0.55); }
    100% { box-shadow: inset 0 0 0 0 rgba(233, 189, 87, 0); }
  }

  @keyframes missFlash {
    0% { box-shadow: inset 0 0 0 0 rgba(169, 72, 59, 0); }
    40% { box-shadow: inset 0 0 0 8px rgba(169, 72, 59, 0.42); }
    100% { box-shadow: inset 0 0 0 0 rgba(169, 72, 59, 0); }
  }

  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    30% { transform: translateX(-7px); }
    65% { transform: translateX(6px); }
  }

  .controls {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    padding: 12px;
    background: #fff0c9;
  }

  .ranking {
    padding: 10px 12px 14px;
    background: #f0d58b;
    border-top: 3px solid var(--brown);
  }

  .ranking-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 8px;
  }

  .ranking h2 {
    margin: 0;
    font-size: 18px;
    letter-spacing: 0.04em;
  }

  .mini-button {
    padding: 5px 10px;
    border: 2px solid #6e3d24;
    background: #fff9e8;
    color: var(--ink);
    cursor: pointer;
    font-weight: 900;
    touch-action: manipulation;
  }

  .ranking-list {
    display: grid;
    grid-template-columns: repeat(5, minmax(0, 1fr));
    gap: 8px;
    margin: 0;
    padding: 0;
    list-style: none;
  }

  .ranking-list li {
    min-height: 74px;
    padding: 8px;
    background: #fff9e8;
    border: 2px solid #8e552d;
    font-weight: 900;
  }

  .ranking-rank {
    display: inline-grid;
    place-items: center;
    width: 24px;
    height: 24px;
    margin-right: 4px;
    color: #fff8df;
    background: var(--red);
    border: 2px solid #7a261b;
    border-radius: 50%;
    font-size: 13px;
  }

  .ranking-main {
    display: block;
    margin-top: 2px;
    font-size: 17px;
  }

  .ranking-name {
    display: block;
    margin-top: 5px;
    color: #5b3525;
    font-size: 13px;
    font-weight: 900;
    overflow-wrap: anywhere;
  }

  .ranking-sub {
    display: block;
    margin-top: 2px;
    color: #765035;
    font-size: 12px;
    line-height: 1.35;
  }

  .ranking-status {
    margin: -2px 0 8px;
    color: #765035;
    font-size: 12px;
    font-weight: 900;
  }

  .ranking-empty {
    grid-column: 1 / -1;
    min-height: auto;
    text-align: center;
    color: #765035;
  }

  .item-button {
    display: grid;
    grid-template-columns: auto 1fr;
    align-items: center;
    gap: 9px;
    min-height: 72px;
    padding: 8px 10px;
    border: 3px solid #6e3d24;
    background: #fff9e8;
    color: var(--ink);
    cursor: pointer;
    font-weight: 900;
    text-align: left;
    touch-action: manipulation;
    box-shadow: 0 5px 0 #c98943;
    transition: transform 0.08s ease, box-shadow 0.08s ease, background 0.12s ease;
  }

  .item-button:hover:not(:disabled) {
    background: #fff3cf;
  }

  .item-button:active:not(:disabled) {
    transform: translateY(4px);
    box-shadow: 0 1px 0 #c98943;
  }

  .item-button:disabled {
    cursor: not-allowed;
    opacity: 0.55;
  }

  .item-mark {
    display: grid;
    place-items: center;
    width: 38px;
    height: 38px;
    color: #fff8df;
    background: var(--red);
    border: 2px solid #7a261b;
    border-radius: 50%;
    font-size: 20px;
    line-height: 1;
  }

  .item-text {
    min-width: 0;
  }

  .item-name {
    display: block;
    font-size: clamp(18px, 3.5vw, 25px);
  }

  .item-price {
    display: block;
    margin-top: 4px;
    font-size: 14px;
    color: #765035;
  }

  .overlay {
    position: absolute;
    inset: 0;
    z-index: 10;
    display: grid;
    place-items: center;
    padding: 18px;
    background: rgba(255, 247, 223, 0.9);
  }

  .panel {
    width: min(460px, 100%);
    padding: 20px;
    text-align: center;
    background: #fff9e8;
    border: 4px solid #6e3d24;
    box-shadow: 7px 7px 0 rgba(74, 44, 26, 0.18);
  }

  .panel h2 {
    margin: 0 0 8px;
    font-size: clamp(24px, 5vw, 36px);
  }

  .panel p {
    margin: 8px 0 14px;
    font-weight: 700;
    line-height: 1.55;
  }

  .player-name {
    margin: 12px 0 14px;
    text-align: left;
  }

  .player-name label {
    display: block;
    margin-bottom: 6px;
    text-align: center;
    font-weight: 900;
  }

  .player-name input {
    width: 100%;
    min-height: 44px;
    padding: 8px 10px;
    border: 3px solid #8e552d;
    background: #fffef5;
    color: var(--ink);
    font: inherit;
    font-weight: 900;
    text-align: center;
  }

  .player-name small {
    display: block;
    margin-top: 5px;
    color: #765035;
    text-align: center;
    font-size: 12px;
    font-weight: 900;
  }

  .difficulty-select {
    margin: 12px 0 16px;
    text-align: left;
  }

  .difficulty-label {
    margin-bottom: 7px;
    text-align: center;
    font-weight: 900;
  }

  .difficulty-options {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
  }

  .difficulty-option {
    cursor: pointer;
  }

  .difficulty-option input {
    position: absolute;
    opacity: 0;
    pointer-events: none;
  }

  .difficulty-card {
    display: block;
    min-height: 74px;
    padding: 8px 6px;
    background: #fff9e8;
    border: 3px solid #8e552d;
    text-align: center;
    font-weight: 900;
  }

  .difficulty-card small {
    display: block;
    margin-top: 4px;
    color: #765035;
    font-size: 12px;
    line-height: 1.35;
  }

  .difficulty-option input:checked + .difficulty-card {
    color: #fff8df;
    background: #4b8f76;
    border-color: #31594b;
    box-shadow: inset 0 0 0 2px #fff8df;
  }

  .difficulty-option input:checked + .difficulty-card small {
    color: #fff8df;
  }

  .result-title {
    display: block;
    margin-bottom: 7px;
    color: #bd3a2b;
    font-size: clamp(22px, 4.5vw, 32px);
    font-weight: 900;
  }

  .result-note {
    display: block;
    margin-bottom: 8px;
    color: #765035;
    font-weight: 900;
  }

  .start-button {
    min-width: 190px;
    padding: 12px 18px;
    border: 3px solid #6e3d24;
    background: var(--red);
    color: #fff8df;
    cursor: pointer;
    font-size: 20px;
    font-weight: 900;
    touch-action: manipulation;
    box-shadow: 0 5px 0 #7a261b;
  }

  .start-button:active {
    transform: translateY(4px);
    box-shadow: 0 1px 0 #7a261b;
  }

  .end-actions {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 10px;
    margin-top: 10px;
  }

  .end-actions .start-button {
    max-width: 100%;
  }

  .secondary-button {
    min-width: 230px;
    background: #fff9e8;
    color: var(--ink);
    box-shadow: 0 5px 0 #8e552d;
  }

  .secondary-button:active {
    box-shadow: 0 1px 0 #8e552d;
  }

  .hidden {
    display: none;
  }

  @media (max-width: 640px) {
    .overlay {
      place-items: start center;
      padding: 10px 12px;
      overflow-y: auto;
    }

    .panel {
      width: min(440px, 100%);
      max-height: calc(100% - 20px);
      padding: 12px;
      border-width: 3px;
      overflow-y: auto;
      box-shadow: 4px 4px 0 rgba(74, 44, 26, 0.18);
    }

    .panel h2 {
      margin-bottom: 4px;
      font-size: 26px;
    }

    .panel p {
      margin: 4px 0 8px;
      font-size: 14px;
      line-height: 1.45;
    }

    .player-name {
      margin: 8px 0 10px;
    }

    .player-name label,
    .difficulty-label {
      margin-bottom: 5px;
      font-size: 14px;
    }

    .player-name input {
      min-height: 38px;
      padding: 6px 8px;
      border-width: 2px;
    }

    .player-name small {
      margin-top: 4px;
      font-size: 11px;
    }

    .difficulty-select {
      margin: 8px 0 10px;
    }

    .difficulty-options {
      gap: 6px;
    }

    .difficulty-card {
      min-height: 56px;
      padding: 6px 3px;
      border-width: 2px;
      font-size: 14px;
    }

    .difficulty-card small {
      margin-top: 3px;
      font-size: 10px;
      line-height: 1.25;
    }

    .start-button {
      min-width: 160px;
      padding: 9px 14px;
      font-size: 18px;
      box-shadow: 0 4px 0 #7a261b;
    }

    .secondary-button {
      min-width: min(250px, 100%);
      box-shadow: 0 4px 0 #8e552d;
    }
  }

@media (max-width:480px) {
  .bubble {
    left: 10px;
    right: 10px;
    bottom: 170px;
    width: auto;
    min-height: auto;
    padding: 10px 12px 24px 12px;
    font-size: 14px;
  }
}
    .status {
      grid-template-columns: repeat(2, 1fr);
    }

    .stage {
      height: 430px;
    }

    .shrine {
      width: 300px;
    }

    .roof {
      width: 360px;
      left: -30px;
    }

    .hachiman {
      left: 28%;
      bottom: 10px;
      width: 82px;
    }

    .goods {

<script>
(() => {
  "use strict";

  const products = {
    omamori: {
      name: "おまもり",
      mark: "守",
      price: 500,
      lines: [
        "海の安全を祈りたいな。<br>「おまもり」をください。",

        "航海安全って書いてある品がいいな。<br>小さく持ち歩けるものをください。",
        "出発前に胸元へしまえる縁起物を。<br>頼りになるやつをひとつ。"
      ]
    },
    badge: {

      mark: "缶",

        "友だちに配れる小物を。<br>「缶バッジ」ひとつ！",
        "かばんにつけられる丸い記念品を。<br>小さめで目立つものがいいです。",
        "制服の胸にちょこんと光る品を。<br>一番軽いおみやげをください。"
      ]
    },

      mark: "湯",
      price: 700,
      lines: [
        "甲板そうじにも使えるものを。<br>「タオル」をください。",
        "汗をふける和柄の品がほしいな。<br>「タオル」ありますか？",
        "参拝のあとに使いたいです。<br>「タオル」ひとつ！",
        "手を洗ったあとに使える和柄の品を。<br>大きめのおみやげがいいな。",
        "甲板作業で汗をふけるものを。<br>一番実用的な品をください。"
      ]
    }
  };

  const visitors = [
    { face: "水", name: "水兵さん", color: "#4b8f76", border: "#31594b", greeting: "出港前に寄りました。", patience: 4.8 },
    { face: "旅", name: "旅人さん", color: "#8f6ab8", border: "#5f477c", greeting: "記念のおみやげを探しています。", patience: 4.5 },
    { face: "母", name: "母さん", color: "#d07a57", border: "#8a4b35", greeting: "家族に持って帰りたいです。", patience: 5.2 },
    { face: "船", name: "艦長さん", color: "#4d7fa8", border: "#31576b", greeting: "艦の仲間に頼まれてきました。", patience: 4.1 },
    { face: "福", name: "福の人", color: "#c45d78", border: "#824051", greeting: "縁起のよい品がほしいです。", patience: 4.7 },
    { face: "学", name: "学生さん", color: "#d39a43", border: "#87602a", greeting: "修学旅行の思い出にします。", patience: 4.4 },
    { face: "祖", name: "おじいさん", color: "#6f8fbd", border: "#425a7d", greeting: "孫へのおみやげを選びに来たよ。", patience: 5.5 },
    { face: "写", name: "写真家さん", color: "#5f9b9b", border: "#3b6363", greeting: "絵になる品を探しています。", patience: 3.9 },
    { face: "巫", name: "巫女さん", color: "#b84646", border: "#7a261b", greeting: "社務所から補充に来ました。", patience: 4.9 },
    { face: "商", name: "商人さん", color: "#7b8c45", border: "#4f5d2e", greeting: "売れ筋をひとつ見せてください。", patience: 4.2 }
  ];

  const difficulties = {
    easy: {
      name: "のんびり",
      duration: 35,
      patienceFactor: 1.25,
      scoreMultiplier: 0.9,
      missPenalty: 30,
      comboBonus: 80
    },
    normal: {
      name: "ふつう",
      duration: 30,
      patienceFactor: 1,
      scoreMultiplier: 1,
      missPenalty: 40,
      comboBonus: 100
    },
    hard: {
      name: "大忙し",
      duration: 25,
      patienceFactor: 0.78,
      scoreMultiplier: 1.25,
      missPenalty: 60,
      comboBonus: 150
    }
  };

  const defaultPatience = 4.5;
  const rankingKey = "hachiman-shop-ranking-v03";
  const playerNameKey = "hachiman-shop-player-name";
  const onlineRankingUrl = "https://script.google.com/macros/s/AKfycbybwOEImMHuiC_ze7mbzGLkJP3j9nj6HwO8WEzyWWOM_5PhW-ucjFtD8S_p-XblMS_hnw/exec";
  const gameCenterEntranceUrl = "https://kantaihachiman.github.io/game-center/";
  let memoryRanking = {};
  let onlineRanking = {};
  let onlineRankingLoaded = {};
  let onlineRequestId = 0;
  let activeDifficultyKey = "normal";
  let playerName = "名無しの参拝者";
  let running = false;
  let timeLeft = difficulties.normal.duration;
  let sales = 0;
  let served = 0;
  let missed = 0;
  let combo = 0;
  let bestCombo = 0;
  let currentItem = "omamori";
  let patienceLimit = defaultPatience;
  let patience = defaultPatience;
  let transitioning = false;
  let tickTimer = null;
  let customerTimer = null;

  const gameEl = document.querySelector(".game");
  const timeEl = document.getElementById("time");
  const salesEl = document.getElementById("sales");
  const servedEl = document.getElementById("served");
  const comboEl = document.getElementById("combo");
  const scoreEl = document.getElementById("score");
  const bubbleEl = document.getElementById("bubble");
  const visitorEl = document.getElementById("visitor");
  const visitorFaceEl = document.getElementById("visitorFace");
  const visitorBodyEl = document.getElementById("visitorBody");
  const visitorNameEl = document.getElementById("visitorName");
  const messageEl = document.getElementById("message");
  const comboBannerEl = document.getElementById("comboBanner");
  const startOverlay = document.getElementById("startOverlay");
  const endOverlay = document.getElementById("endOverlay");
  const resultText = document.getElementById("resultText");
  const rankingTitleEl = document.getElementById("rankingTitle");
  const rankingStatusEl = document.getElementById("rankingStatus");
  const rankingListEl = document.getElementById("rankingList");
  const clearRankingButton = document.getElementById("clearRanking");
  const playerNameInput = document.getElementById("playerName");
  const difficultyInputs = Array.from(document.querySelectorAll('input[name="difficulty"]'));
  const itemButtons = Array.from(document.querySelectorAll(".item-button"));

  function randomFrom(list) {
    return list[Math.floor(Math.random() * list.length)];
  }

  function formatMoney(value) {
    return value.toLocaleString("ja-JP") + "文";
  }

  function currentDifficulty() {
    return difficulties[activeDifficultyKey] || difficulties.normal;
  }

  function syncDifficultyFromInput() {
    const checked = difficultyInputs.find(input => input.checked);
    activeDifficultyKey = checked && difficulties[checked.value] ? checked.value : "normal";
  }

  function rankingStorageKey() {
    return rankingKey + "-" + activeDifficultyKey;
  }

  function onlineEnabled() {
    return onlineRankingUrl.indexOf("https://") === 0;
  }

  function cleanPlayerName(value) {
    const cleaned = String(value || "").trim().replace(/\s+/g, " ").slice(0, 12);
    return cleaned || "名無しの参拝者";
  }

  function loadPlayerName() {
    try {
      const savedName = window.localStorage.getItem(playerNameKey) || "";
      playerNameInput.value = savedName;
      playerName = cleanPlayerName(savedName);
    } catch (error) {
      playerName = cleanPlayerName(playerNameInput.value);
    }
  }

  function syncPlayerName() {
    const rawName = String(playerNameInput.value || "").trim().replace(/\s+/g, " ").slice(0, 12);
    playerNameInput.value = rawName;
    playerName = cleanPlayerName(rawName);
    try {
      window.localStorage.setItem(playerNameKey, rawName);
    } catch (error) {
      // 名前を保存できない環境でも、今回のプレイには使えます。
    }
  }

  function returnToGameCenter() {
    const entranceUrl = gameCenterEntranceUrl.trim();
    if (entranceUrl) {
      window.location.href = entranceUrl;
      return;
    }

    if (window.history && window.history.length > 1) {
      window.history.back();
      return;
    }

    endOverlay.classList.add("hidden");
    startOverlay.classList.remove("hidden");
    setButtons(false);
    if (typeof window.scrollTo === "function") {
      window.scrollTo({ top: 0, behavior: "smooth" });
    }
  }

  function calculateScore() {
    const difficulty = currentDifficulty();
    const baseScore = sales + served * 120 + bestCombo * 80 - missed * difficulty.missPenalty;
    return Math.max(0, Math.round(baseScore * difficulty.scoreMultiplier));
  }

  function updateStatus() {
    timeEl.textContent = Math.max(0, timeLeft).toFixed(1) + "秒";
    salesEl.textContent = formatMoney(sales);
    servedEl.textContent = served + "人";
    comboEl.textContent = combo;
    scoreEl.textContent = calculateScore().toLocaleString("ja-JP") + "点";
  }

  function escapeHtml(text) {
    return String(text).replace(/[&<>"']/g, char => ({
      "&": "&amp;",
      "<": "&lt;",
      ">": "&gt;",
      '"': "&quot;",
      "'": "&#39;"
    })[char]);
  }

  function setRankingStatus(text) {
    rankingStatusEl.textContent = text;
  }

  function readLocalRanking() {
    try {
      const raw = window.localStorage.getItem(rankingStorageKey());
      if (!raw) return memoryRanking[activeDifficultyKey] || [];
      const parsed = JSON.parse(raw);
      return Array.isArray(parsed) ? parsed : [];
    } catch (error) {
      return memoryRanking[activeDifficultyKey] || [];
    }
  }

  function writeLocalRanking(entries) {
    memoryRanking[activeDifficultyKey] = entries;
    try {
      window.localStorage.setItem(rankingStorageKey(), JSON.stringify(entries));
    } catch (error) {
      // ファイルを直接開いた環境で保存できない場合は、この画面中だけ保持します。
    }
  }

  function readRanking() {
    if (onlineRankingLoaded[activeDifficultyKey]) {
      return onlineRanking[activeDifficultyKey] || [];
    }
    return readLocalRanking();
  }

  function makeDateLabel() {
    const now = new Date();
    const month = now.getMonth() + 1;
    const day = now.getDate();
    const hour = String(now.getHours()).padStart(2, "0");
    const minute = String(now.getMinutes()).padStart(2, "0");
    return month + "/" + day + " " + hour + ":" + minute;
  }

  function makeShortDateLabel(value) {
    const date = new Date(value);
    if (Number.isNaN(date.getTime())) return String(value || "");
    const month = date.getMonth() + 1;
    const day = date.getDate();
    const hour = String(date.getHours()).padStart(2, "0");
    const minute = String(date.getMinutes()).padStart(2, "0");
    return month + "/" + day + " " + hour + ":" + minute;
  }

  function sortRankingEntries(entries) {
    return entries.slice().sort((a, b) => {
      const salesDiff = (Number(b.sales) || 0) - (Number(a.sales) || 0);
      if (salesDiff !== 0) return salesDiff;
      const scoreDiff = (Number(b.score) || 0) - (Number(a.score) || 0);
      if (scoreDiff !== 0) return scoreDiff;
      return String(b.createdAt || b.date || "").localeCompare(String(a.createdAt || a.date || ""));
    });
  }

  function normalizeRankingEntries(data) {
    const source = Array.isArray(data) ? data :
      Array.isArray(data.entries) ? data.entries :
      Array.isArray(data.ranking) ? data.ranking :
      Array.isArray(data.scores) ? data.scores : [];

    return sortRankingEntries(source.map(entry => {
      const difficultyKey = entry.difficultyKey || activeDifficultyKey;
      const difficulty = entry.difficulty || (difficulties[difficultyKey] ? difficulties[difficultyKey].name : currentDifficulty().name);
      return {
        name: entry.name || "名無しの参拝者",
        sales: Number(entry.sales) || 0,
        score: Number(entry.score) || 0,
        served: Number(entry.served) || 0,
        bestCombo: Number(entry.bestCombo || entry.combo) || 0,
        difficulty,
        difficultyKey,
        date: entry.date || makeShortDateLabel(entry.createdAt)
      };
    }).filter(entry => {
      return entry.difficultyKey === activeDifficultyKey || entry.difficulty === currentDifficulty().name;
    })).slice(0, 5);
  }

  function buildOnlineUrl(params) {
    const query = new URLSearchParams(params);
    return onlineRankingUrl + "?" + query.toString();
  }

  function requestRankingJsonp(key, requestId) {
    return new Promise((resolve, reject) => {
      const callbackName = "__hachimanRanking" + Date.now() + Math.floor(Math.random() * 10000);
      const script = document.createElement("script");
      const timeoutId = setTimeout(() => {
        cleanup();
        reject(new Error("JSONP timeout"));
      }, 8000);

      function cleanup() {
        clearTimeout(timeoutId);
        delete window[callbackName];
        if (script.parentNode) script.parentNode.removeChild(script);
      }

      window[callbackName] = data => {
        cleanup();
        resolve(data);
      };

      script.onerror = () => {
        cleanup();
        reject(new Error("JSONP failed"));
      };
      script.src = buildOnlineUrl({
        action: "list",
        difficulty: key,
        limit: "5",
        callback: callbackName,
        t: Date.now()
      });
      document.body.appendChild(script);
    });
  }

  async function loadOnlineRanking() {
    if (!onlineEnabled()) {
      setRankingStatus("ローカルランキング表示中");
      return;
    }

    const key = activeDifficultyKey;
    const requestId = ++onlineRequestId;
    setRankingStatus("オンラインランキングを確認中...");

    try {
      let data = null;
      if (typeof fetch === "function") {
        const response = await fetch(buildOnlineUrl({
          action: "list",
          difficulty: key,
          limit: "5",
          t: Date.now()
        }), { method: "GET", cache: "no-store" });
        if (!response.ok) throw new Error("HTTP " + response.status);
        data = await response.json();
      } else {
        data = await requestRankingJsonp(key, requestId);
      }

      if (requestId !== onlineRequestId || key !== activeDifficultyKey) return;
      onlineRanking[key] = normalizeRankingEntries(data);
      onlineRankingLoaded[key] = true;
      renderRanking();
      setRankingStatus(onlineRanking[key].length ? "オンラインランキング表示中" : "オンラインランキングはまだありません");
    } catch (error) {
      try {
        const data = await requestRankingJsonp(key, requestId);
        if (requestId !== onlineRequestId || key !== activeDifficultyKey) return;
        onlineRanking[key] = normalizeRankingEntries(data);
        onlineRankingLoaded[key] = true;
        renderRanking();
        setRankingStatus(onlineRanking[key].length ? "オンラインランキング表示中" : "オンラインランキングはまだありません");
      } catch (jsonpError) {
        if (requestId === onlineRequestId && key === activeDifficultyKey) {
          onlineRankingLoaded[key] = false;
          renderRanking();
          setRankingStatus("オンラインにつながらないためローカル表示中");
        }
      }
    }
  }

  function renderRanking() {
    rankingTitleEl.textContent = "売上ランキング（" + currentDifficulty().name + "）";
    const entries = readRanking();
    if (!entries.length) {
      rankingListEl.innerHTML = '<li class="ranking-empty">まだ記録はありません</li>';
      return;
    }

    rankingListEl.innerHTML = entries.map((entry, index) => {
      const entrySales = Number(entry.sales) || 0;
      const entryScore = Number(entry.score) || 0;
      const entryServed = Number(entry.served) || 0;
      const entryCombo = Number(entry.bestCombo) || 0;
      const entryName = escapeHtml(entry.name || "名無しの参拝者");
      const entryDate = escapeHtml(entry.date || "");
      const entryDifficulty = escapeHtml(entry.difficulty || currentDifficulty().name);

      return '<li>' +
        '<span class="ranking-rank">' + (index + 1) + '</span>' +
        '<span class="ranking-name">' + entryName + '</span>' +
        '<span class="ranking-main">' + formatMoney(entrySales) + '</span>' +
        '<span class="ranking-sub">' + entryDifficulty + ' / ' + entryDate + '<br>' +
        entryServed + '人 / ' + entryCombo + '連 / ' + entryScore.toLocaleString("ja-JP") + '点</span>' +
        '</li>';
    }).join("");
  }

  function recordRanking(score) {
    const entry = {
      name: playerName,
      sales,
      score: Math.max(0, score),
      served,
      bestCombo,
      missed,
      difficultyKey: activeDifficultyKey,
      difficulty: currentDifficulty().name,
      date: makeDateLabel(),
      createdAt: new Date().toISOString(),
      version: "0.3"
    };
    const entries = readLocalRanking();
    entries.push(entry);

    writeLocalRanking(sortRankingEntries(entries).slice(0, 5));
    onlineRankingLoaded[activeDifficultyKey] = false;
    renderRanking();
    sendOnlineRanking(entry);
  }

  async function sendOnlineRanking(entry) {
    if (!onlineEnabled() || typeof fetch !== "function") return;

    setRankingStatus("オンラインランキングへ送信中...");
    try {
      await fetch(onlineRankingUrl, {
        method: "POST",
        mode: "no-cors",
        headers: {
          "Content-Type": "text/plain;charset=utf-8"
        },
        body: JSON.stringify({
          action: "add",
          entry
        })
      });
      setRankingStatus("オンラインへ送信しました。反映を確認中...");
      setTimeout(loadOnlineRanking, 700);
    } catch (error) {
      setRankingStatus("送信できないためローカル記録として保存しました");
    }
  }

  function setButtons(enabled) {
    itemButtons.forEach(button => {
      button.disabled = !enabled;
    });
  }

  function showMessage(text, good) {
    messageEl.textContent = text;
    messageEl.style.background = good ? "#4b8f76" : "#a9483b";
    messageEl.style.borderColor = good ? "#31594b" : "#763025";
    messageEl.classList.remove("show");
    void messageEl.offsetWidth;
    messageEl.classList.add("show");
  }

  function showComboBanner(nextCombo, bonus) {
    if (nextCombo < 2) return;

    const label = nextCombo >= 5 ? "大吉" : nextCombo >= 3 ? "商売繁盛" : "連続";
    comboBannerEl.textContent = label + " " + nextCombo + "連続！" + (bonus ? " +" + formatMoney(bonus) : "");
    comboBannerEl.classList.remove("show");
    void comboBannerEl.offsetWidth;
    comboBannerEl.classList.add("show");
  }

  function resultTitle(score) {
    if (score >= 16000 || sales >= 13000) {
      return { name: "神域の売店奉行", note: "艦隊八幡社の売店伝説に名を刻みました。" };
    }
    if (score >= 13500 || sales >= 11000) {
      return { name: "伝説の艦隊売店長", note: "お客さんの波を見事にさばく、別格の売り子です。" };
    }
    if (score >= 11000 || sales >= 9000) {
      return { name: "艦隊商売繁盛王", note: "艦隊八幡社に行列ができる名物店員です。" };
    }
    if (score >= 9000 || sales >= 7600) {
      return { name: "八幡社の大番頭", note: "売上も段取りも、社のみんなが頼りにしています。" };
    }
    if (bestCombo >= 10 && score >= 7000) {
      return { name: "大吉連続の達人", note: "れんぞく販売の勢いで、福を呼び込みました。" };
    }
    if (score >= 7500 || sales >= 6200) {
      return { name: "八幡社の看板店員", note: "売店前でうわさになるほどの働きぶりです。" };
    }
    if (score >= 6200 || sales >= 5000) {
      return { name: "海風の販売名人", note: "潮風に乗るような軽やかな注文さばきでした。" };
    }
    if (score >= 5000 || sales >= 4200) {
      return { name: "八幡社の名物店員", note: "お客さんの注文さばきが見事でした。" };
    }
    if (score >= 4000 || sales >= 3300) {
      return { name: "売店の達人", note: "はちまん売店をしっかり支えました。" };
    }
    if (score >= 3000 || sales >= 2500) {
      return { name: "てきぱき販売係", note: "迷いの少ない接客で、売店にいい流れを作りました。" };
    }
    if (score >= 2200 || sales >= 1800) {
      return { name: "おみやげ案内人", note: "参拝のお客さんに、ぴったりの品を届けました。" };
    }
    if (score >= 1400 || sales >= 1200) {
      return { name: "見習い売り子", note: "落ち着いて続ければ、もっと伸びそうです。" };
    }
    if (score >= 700 || sales >= 600) {
      return { name: "駆け出し店番", note: "まずは売店の流れをつかみ始めました。" };
    }
    return { name: "開店初日", note: "ここから商売繁盛を目指しましょう。" };
  }

  function clearCustomerTimer() {
    if (customerTimer) {
      window.clearTimeout(customerTimer);
      customerTimer = null;
    }
  }

  function flashResult(good) {
    const className = good ? "good-sale" : "miss-sale";
    gameEl.classList.remove("good-sale", "miss-sale");
    void gameEl.offsetWidth;
    gameEl.classList.add(className);
    window.setTimeout(() => {
      gameEl.classList.remove(className);
    }, 360);
  }

  function updatePatienceBar() {
    const bar = document.getElementById("patienceBar");
    if (!bar) return;

    const ratio = Math.max(0, patience / patienceLimit);
    bar.style.width = (ratio * 100) + "%";
    bar.classList.toggle("mid", ratio <= 0.55 && ratio > 0.25);
    bar.classList.toggle("low", ratio <= 0.25);
  }

  function queueNextCustomer(delay) {
    transitioning = true;
    setButtons(false);
    clearCustomerTimer();
    customerTimer = window.setTimeout(() => {
      customerTimer = null;
      if (!running) return;
      transitioning = false;
      newCustomer();
      setButtons(true);
      updateStatus();
    }, delay);
  }

  function newCustomer() {
    const keys = Object.keys(products);
    currentItem = randomFrom(keys);
    const product = products[currentItem];
    const guest = randomFrom(visitors);
    patienceLimit = guest.patience * currentDifficulty().patienceFactor;
    patience = patienceLimit;
    transitioning = false;

    visitorFaceEl.textContent = guest.face;
    visitorNameEl.textContent = guest.name;
    visitorBodyEl.style.background = guest.color;
    visitorBodyEl.style.borderColor = guest.border;
    bubbleEl.innerHTML = '<span class="customer-line">' + guest.greeting + '</span>' +
      randomFrom(product.lines) + '<div class="patience"><span id="patienceBar"></span></div>';

    visitorEl.classList.remove("enter");
    void visitorEl.offsetWidth;
    visitorEl.classList.add("enter");
    updatePatienceBar();
  }

  function serve(itemKey) {
    if (!running || transitioning) return;

    const selected = products[itemKey];
    const wanted = products[currentItem];

    if (itemKey === currentItem) {
      const nextCombo = combo + 1;
      const bonus = nextCombo >= 3
        ? currentDifficulty().comboBonus + Math.max(0, nextCombo - 3) * 50
        : 0;
      const total = selected.price + bonus;
      sales += total;
      served += 1;
      combo = nextCombo;
      bestCombo = Math.max(bestCombo, combo);
      showMessage("正解！ +" + formatMoney(total) + (bonus ? " 連続ボーナス！" : ""), true);
      showComboBanner(nextCombo, bonus);
      flashResult(true);
    } else {
      missed += 1;
      combo = 0;
      showMessage("ちがった！ 注文は「" + wanted.name + "」", false);
      flashResult(false);
    }

    updateStatus();
    queueNextCustomer(520);
  }

  function startGame() {
    syncDifficultyFromInput();
    syncPlayerName();
    const difficulty = currentDifficulty();
    running = true;
    timeLeft = difficulty.duration;
    sales = 0;
    served = 0;
    missed = 0;
    combo = 0;
    bestCombo = 0;
    patienceLimit = defaultPatience * difficulty.patienceFactor;
    patience = patienceLimit;
    transitioning = false;
    clearCustomerTimer();
    gameEl.classList.remove("good-sale", "miss-sale");
    startOverlay.classList.add("hidden");
    endOverlay.classList.add("hidden");
    setButtons(true);
    updateStatus();
    newCustomer();

    clearInterval(tickTimer);
    tickTimer = setInterval(() => {
      timeLeft -= 0.1;

      if (!transitioning) {
        patience -= 0.1;
        updatePatienceBar();

        if (patience <= 0 && running) {
          missed += 1;
          combo = 0;
          showMessage("お客さんが帰っちゃった", false);
          flashResult(false);
          updateStatus();
          queueNextCustomer(430);
        }
      }

      updateStatus();

      if (timeLeft <= 0) {
        finishGame();
      }
    }, 100);
  }

  function finishGame() {
    running = false;
    clearInterval(tickTimer);
    clearCustomerTimer();
    transitioning = false;
    setButtons(false);
    timeLeft = 0;
    updateStatus();

    const score = calculateScore();
    const title = resultTitle(score);
    recordRanking(score);
    resultText.innerHTML =
      '<span class="result-title">' + escapeHtml(title.name) + '</span>' +
      '<span class="result-note">' + escapeHtml(title.note) + '</span>' +
      "記録名 " + escapeHtml(playerName) + " / 難易度 " + currentDifficulty().name + " / 売上 <strong>" + formatMoney(sales) + "</strong><br>" +
      "販売数 " + served + "人 / ミス " + missed + "回 / 最高れんぞく " + bestCombo + " / スコア " + score.toLocaleString("ja-JP") + "点";
    endOverlay.classList.remove("hidden");
  }

  document.getElementById("startButton").addEventListener("click", startGame);
  document.getElementById("restartButton").addEventListener("click", startGame);
  document.getElementById("startGameCenterButton").addEventListener("click", returnToGameCenter);
  document.getElementById("gameCenterButton").addEventListener("click", returnToGameCenter);
  playerNameInput.addEventListener("change", syncPlayerName);
  playerNameInput.addEventListener("blur", syncPlayerName);
  clearRankingButton.addEventListener("click", () => {
    writeLocalRanking([]);
    onlineRankingLoaded[activeDifficultyKey] = false;
    renderRanking();
    setRankingStatus("ローカル記録をリセットしました");
    loadOnlineRanking();
  });
  difficultyInputs.forEach(input => {
    input.addEventListener("change", () => {
      syncDifficultyFromInput();
      if (!running) {
        timeLeft = currentDifficulty().duration;
        patienceLimit = defaultPatience * currentDifficulty().patienceFactor;
        patience = patienceLimit;
        updateStatus();
      }
      renderRanking();
      loadOnlineRanking();
    });
  });
  itemButtons.forEach(button => {
    button.addEventListener("click", () => serve(button.dataset.item));
  });
  document.addEventListener("keydown", event => {
    if (!running || transitioning || event.repeat) return;
    const index = Number(event.key) - 1;
    const button = itemButtons[index];
    if (button && !button.disabled) {
      button.click();
    }
  });

  syncDifficultyFromInput();
  loadPlayerName();
  timeLeft = currentDifficulty().duration;
  updateStatus();
  renderRanking();
  loadOnlineRanking();
})();
</script>
</body>
</html>
